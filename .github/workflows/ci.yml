name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            admin-web/package-lock.json
      - name: Validate plugin release metadata
        run: node scripts/verify-plugin-release.mjs
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci
      - name: Typecheck plugin
        working-directory: plugin
        run: npm run typecheck
      - name: Test plugin
        working-directory: plugin
        run: npm test
      - name: Bundle plugin
        working-directory: plugin
        run: npm run build
      - name: Install admin Web dependencies
        working-directory: admin-web
        run: npm ci
      - name: Typecheck admin Web
        working-directory: admin-web
        run: npm run typecheck
      - name: Test admin Web
        working-directory: admin-web
        run: npm test
      - name: Bundle admin Web
        working-directory: admin-web
        run: npm run build

  go-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go race detector
        run: go test -race ./... -count=1

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: obsidian-sync-tunnel:ci
          build-args: |
            VERSION=ci
