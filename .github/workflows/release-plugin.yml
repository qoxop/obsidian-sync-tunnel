name: Release Sync Tunnel

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        working-directory: plugin
        run: npm ci
      - name: Typecheck
        working-directory: plugin
        run: npm run typecheck
      - name: Test
        working-directory: plugin
        run: npm test
      - name: Build plugin
        working-directory: plugin
        run: npm run build
      - name: Validate release metadata and assets
        run: node scripts/verify-plugin-release.mjs "$GITHUB_REF_NAME" --artifacts
      - name: Generate checksums and plugin SBOM
        shell: bash
        run: |
          sha256sum plugin/main.js manifest.json plugin/styles.css > SHA256SUMS.txt
          npm sbom --prefix plugin --sbom-format cyclonedx > plugin-sbom.cdx.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_flag=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            plugin/main.js \
            manifest.json \
            plugin/styles.css \
            SHA256SUMS.txt \
            plugin-sbom.cdx.json \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease_flag[@]}"

  server-image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign published image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
