name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        working-directory: plugin
        run: npm ci
      - name: Typecheck
        working-directory: plugin
        run: npm run typecheck
      - name: Test
        working-directory: plugin
        run: npm test
      - name: Build plugin
        working-directory: plugin
        run: npm run build
      - name: Validate release metadata and assets
        run: node scripts/verify-plugin-release.mjs "$GITHUB_REF_NAME" --artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          plugin/main.js
          manifest.json
          plugin/styles.css
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
