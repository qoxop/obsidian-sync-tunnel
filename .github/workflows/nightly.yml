name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * *"

permissions:
  contents: read
  packages: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - working-directory: plugin
        run: npm ci
      - working-directory: plugin
        run: npm run typecheck && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sync-tunnel-plugin-nightly
          path: |
            plugin/main.js
            plugin/styles.css
            manifest.json
          retention-days: 14

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:nightly
          build-args: VERSION=nightly-${{ github.sha }}
          provenance: mode=max
          sbom: true

  scale-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Ten-thousand-file state test
        env:
          OBSIDIAN_SYNC_SCALE_TEST: "1"
        run: go test ./internal/store -run '^TestScaleTenThousandFiles$' -count=1 -v
