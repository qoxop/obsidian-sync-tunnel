version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /plugin
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      plugin-dependencies:
        patterns:
          - "*"
    ignore:
      # Obsidian's current declarations do not typecheck with TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      admin-web-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      docker-dependencies:
        patterns:
          - "*"
